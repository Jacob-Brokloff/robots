# Desktop: leader arms + Strands robot-client that drives the XLeRobot Pi over WiFi.
#   docker compose -f deploy/desktop/docker-compose.yml build
#   docker compose -f deploy/desktop/docker-compose.yml run --rm robot-client strands-robots doctor
#   docker compose -f deploy/desktop/docker-compose.yml run --rm robot-client python scripts/teleop_xlerobot.py
#   docker compose -f deploy/desktop/docker-compose.yml up -d dashboard   # http://localhost:8090 (passkey login)
#   docker compose -f deploy/desktop/docker-compose.yml run --rm sim python examples/01_sim_hello_world.py
# MuJoCo renders headless through EGL on the host GPU (mesa). The containers run as root, which
# opens /dev/dri without the host's video/render groups, so no group_add.
x-gpu: &gpu
  MUJOCO_GL: egl

x-robot: &robot
  image: strands-xlerobot:latest
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  network_mode: host
  env_file:
    - path: ../.env
      required: false
  volumes:
    - ../strands:/strands
    - ${HOME}/.cache/huggingface/lerobot:/root/.cache/huggingface/lerobot
    - ../../scripts:/opt/strands/scripts
    - ../xlerobot_client:/opt/strands/deploy/xlerobot_client
    - /dev/serial/by-id:/dev/serial/by-id:ro
  devices:
    - /dev/ttyACM0
    - /dev/ttyACM1

services:
  # Operator dashboard on the machine with the leader arms, so its device manager can see them.
  # Loopback only: passkeys need http://localhost. No static token, so first enrolment uses the
  # one-time bootstrap file the server writes under deploy/strands/.
  dashboard:
    <<: *robot
    restart: unless-stopped
    devices:
      - /dev/ttyACM0
      - /dev/ttyACM1
      - /dev/dri
    environment:
      <<: *gpu
      STRANDS_BASE_DIR: /strands
      DASHBOARD_AUTH_TOKEN: ""
      # Fixed mesh id (default is dashboard-<host>-<random>): the Pi's STRANDS_ROBOT_COMMAND_ALLOW
      # scopes teleop_receive to this sender.
      STRANDS_DASHBOARD_PEER_ID: dashboard-desktop
      # Camera rate for the sims this dashboard spawns (twins); inherited by its children. 15 fps keeps a
      # twin following the leaders smooth; a reused renderer makes it ~10 ms per camera.
      STRANDS_MESH_CAMERA_HZ: "15"
    volumes:
      - ../strands:/strands
      - ../strands/dashboard-auth:/root/.strands_dashboard
      - ${HOME}/.cache/huggingface/lerobot:/root/.cache/huggingface/lerobot
      - ../../scripts:/opt/strands/scripts
      - ../xlerobot_client:/opt/strands/deploy/xlerobot_client
      - /dev/serial/by-id:/dev/serial/by-id:ro
    command: ["strands-robots", "dashboard", "--host", "127.0.0.1", "--port", "8090"]

  # The two leader arms as mesh peer `leader-arms`, publishing teleop stream `leader`, so the dashboard's
  # "follow" works (scripts/leader_peer.py). Holds both leader ports while up: stop it before running
  # teleop_xlerobot.py or lerobot-record against the leaders.
  leader:
    <<: *robot
    restart: unless-stopped
    environment:
      STRANDS_BASE_DIR: /strands
    working_dir: /opt/strands/scripts
    command: ["python", "leader_peer.py"]

  robot-client:
    <<: *robot
    environment:
      STRANDS_BASE_DIR: /strands
    stdin_open: true
    tty: true
    command: ["strands-robots", "doctor"]

  # Sim only: examples, doctor, MuJoCo scripts. Same image, GPU but no serial devices.
  sim:
    <<: *robot
    devices:
      - /dev/dri
    volumes:
      - ../strands:/strands
      - ../../scripts:/opt/strands/scripts
      - ../../examples:/opt/strands/examples
      - ../sim:/opt/strands/deploy/sim
    environment:
      <<: *gpu
      STRANDS_BASE_DIR: /strands
    stdin_open: true
    tty: true
    command: ["strands-robots", "doctor"]
